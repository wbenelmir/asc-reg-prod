<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    ASC 2026 interface icons (Phase 3 Prompt 5). Project-owned geometry,
    drawn for this platform on a 24px grid with 2px round strokes to match
    the line-icon language of the Finder reference (Finder's own icon font
    is NOT copied). Every icon is decorative next to visible text:
    templates reference it with aria-hidden="true" via
    templates/components/icon.html. Icons marked "directional" are mirrored
    in RTL by the .asc-icon-flip class; all others never mirror.
  -->
  <defs>
    <style>
      symbol { overflow: visible; }
    </style>
  </defs>

  <!-- Results -->
  <symbol id="i-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.4l3 3 6-6.3"/>
  </symbol>
  <symbol id="i-x-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8"/>
  </symbol>
  <symbol id="i-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M5.3 5.3l13.4 13.4"/>
  </symbol>
  <symbol id="i-alert-triangle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.3 3.9L2.4 17.6a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9.2v4.4M12 17.2h.01"/>
  </symbol>
  <symbol id="i-alert-octagon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.1 2.5h7.8l5.6 5.6v7.8l-5.6 5.6H8.1l-5.6-5.6V8.1z"/><path d="M12 7.6v5.2M12 16.4h.01"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.6M12 7.6h.01"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 5v5h-5"/><path d="M3.5 19v-5h5"/><path d="M5.2 9a7.5 7.5 0 0112.9-2.2l2.4 3.2M18.8 15a7.5 7.5 0 01-12.9 2.2L3.5 14"/>
  </symbol>
  <symbol id="i-user-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7.5" r="3.8"/><path d="M2.5 20.5v-1.3A5.2 5.2 0 017.7 14h2.6a5.2 5.2 0 015.2 5.2v1.3"/><path d="M16 11.5l2 2 4-4"/>
  </symbol>

  <!-- Lookup methods -->
  <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/>
    <path d="M14 14h3v3h-3zM20 14v.01M14 20.5h.01M17 20.5h3.5V17"/>
  </symbol>
  <symbol id="i-id-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="4.5" width="19" height="15" rx="2"/><circle cx="8.5" cy="11" r="2.3"/><path d="M5.3 16.2a3.4 3.4 0 016.4 0M14.5 9.5h4M14.5 13h4"/>
  </symbol>
  <symbol id="i-hash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 9h16M3.5 15h16M10 3.5l-2 17M16 3.5l-2 17"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.8" cy="10.8" r="6.8"/><path d="M20.5 20.5l-4.9-4.9"/>
  </symbol>

  <!-- Checkpoint identity and connection -->
  <symbol id="i-gate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 21h18M5 21V5a1.5 1.5 0 011.5-1.5h11A1.5 1.5 0 0119 5v16"/><path d="M14.5 12.5h.01"/>
  </symbol>
  <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l9.5 5-9.5 5-9.5-5z"/><path d="M2.5 12.5l9.5 5 9.5-5M2.5 16.5l9.5 5 9.5-5"/>
  </symbol>
  <symbol id="i-tablet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="2.5" width="15" height="19" rx="2.2"/><path d="M11 18h2"/>
  </symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4.2"/><path d="M4 21v-1.2A5.8 5.8 0 019.8 14h4.4a5.8 5.8 0 015.8 5.8V21"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21.5s8-3.8 8-9.8V5.2L12 2.5 4 5.2v6.5c0 6 8 9.8 8 9.8z"/>
  </symbol>
  <symbol id="i-online" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8.8a15.5 15.5 0 0120 0M5.2 12.4a10.8 10.8 0 0113.6 0M8.6 16a5.6 5.6 0 016.8 0M12 19.6h.01"/>
  </symbol>
  <symbol id="i-offline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3l18 18M8.6 16a5.6 5.6 0 016.8 0M12 19.6h.01M5.2 12.4a10.7 10.7 0 013.8-2.1M2 8.8a15.6 15.6 0 014.3-2.7M13.9 5.6A15.4 15.4 0 0122 8.8M16.6 10.9a10.8 10.8 0 012.2 1.5"/>
  </symbol>
  <symbol id="i-cloud-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3l18 18"/><path d="M8.5 7.1A6 6 0 0117.7 11h.8a3.8 3.8 0 012.4 6.8M17 19H7a4.5 4.5 0 01-1.6-8.7"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M12 6.8V12l3.4 2"/>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10.5" width="16" height="11" rx="2"/><path d="M7.8 10.5V7.3a4.2 4.2 0 018.4 0v3.2"/>
  </symbol>

  <!-- Navigation and actions (directional icons mirror in RTL) -->
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 6h12M8.5 12h12M8.5 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>
  </symbol>
  <!-- directional -->
  <symbol id="i-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5.5A2.5 2.5 0 013 18.5v-13A2.5 2.5 0 015.5 3H9M16 17l5-5-5-5M21 12H9"/>
  </symbol>
  <!-- directional -->
  <symbol id="i-arrow-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12h15.5M13.5 6l6 6-6 6"/>
  </symbol>
  <!-- directional -->
  <symbol id="i-chevron-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5.5l6.5 6.5L9 18.5"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v17M5.5 10L12 3.5 18.5 10"/>
  </symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5a14.5 14.5 0 010 19M12 2.5a14.5 14.5 0 000 19"/>
  </symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5.5" width="20" height="13" rx="2"/><path d="M6 9.5h.01M10 9.5h.01M14 9.5h.01M18 9.5h.01M7.5 14.5h9"/>
  </symbol>
  <symbol id="i-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3.5" width="14" height="18" rx="2"/><path d="M9.5 3.5v3h5v-3"/><circle cx="12" cy="12" r="2.4"/><path d="M8.5 17.8a3.8 3.8 0 017 0"/>
  </symbol>
  <symbol id="i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 7.5l-9-4.5-9 4.5v9l9 4.5 9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>
  </symbol>

  <!-- UI/UX Completion Gate, Checkpoint 1. Directional: arrow-prev, log-in. -->
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  </symbol>
  <symbol id="i-arrow-prev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12H4.5M10.5 6l-6 6 6 6"/>
  </symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h4.2L19.4 8.8a2 2 0 000-2.8l-1.4-1.4a2 2 0 00-2.8 0L4 15.8z"/><path d="M13.5 6.5l4 4"/>
  </symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
  </symbol>
  <symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 21V5.5A1.5 1.5 0 015.5 4h8A1.5 1.5 0 0115 5.5V21M15 9.5h3.5A1.5 1.5 0 0120 11v10M2.5 21h19"/><path d="M8 8h3M8 12h3M8 16h3"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v12M6.5 10l5.5 5.5 5.5-5.5M4 20.5h16"/>
  </symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>
  </symbol>
  <symbol id="i-log-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 3h3.5A2.5 2.5 0 0121 5.5v13a2.5 2.5 0 01-2.5 2.5H15M10 17l5-5-5-5M15 12H3"/>
  </symbol>
  <symbol id="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 5h17l-6.5 7.7V19l-4 1.5v-7.8z"/>
  </symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 13.5l2.6-7.8A2 2 0 017.5 4.3h9a2 2 0 011.9 1.4l2.6 7.8V18a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M3 13.5h5l1.5 2.5h5l1.5-2.5h5"/>
  </symbol>
</svg>
